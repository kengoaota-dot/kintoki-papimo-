name: Kintoki PAPIMO Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '10 14 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test PAPIMO 305
        run: python test_papimo.py
      - name: Save PAPIMO HTML
        uses: actions/upload-artifact@v4
        with:
          name: papimo-305-html
          path: papimo_305.html
          if-no-files-found: error
          retention-days: 7
      - name: Save PAPIMO Data
        uses: actions/upload-artifact@v4
        with:
          name: papimo-305-data
          path: papimo_data/
          if-no-files-found: error
          retention-days: 7
