
name: Kintoki PAPIMO Collection

on:
  workflow_dispatch:
  schedule:
    - cron: '10 14 * * *'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect PAPIMO 3 Machines
        run: python collect_papimo.py

      - name: Save PAPIMO 3 Machines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papimo-3-machines
          path: papimo_collection/
          if-no-files-found: error
          retention-days: 7
