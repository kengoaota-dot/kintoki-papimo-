name: Kintoki PAPIMO Collection

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: 'Business date YYYY-MM-DD (blank: latest operating date)'
        required: false
        type: string
      scope:
        description: 'Collection scope'
        required: true
        type: choice
        default: test
        options: [test, all]
  schedule:
    - cron: '10 14 * * *' # 23:10 Asia/Tokyo

permissions:
  contents: read

concurrency:
  group: papimo-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parsing and image validation dependencies
        run: python -m pip install beautifulsoup4==4.14.3 Pillow==12.0.0
      - name: Test parser and validation safeguards
        run: python collect_papimo.py --self-test
      - name: Collect and validate PAPIMO
        env:
          PAPIMO_BUSINESS_DATE: ${{ inputs.business_date }}
          PAPIMO_SCOPE: ${{ inputs.scope || 'test' }}
        run: python collect_papimo.py --scope "$PAPIMO_SCOPE"
      - name: Preserve collection and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: papimo-${{ github.run_id }}-${{ github.run_attempt }}
          path: papimo_collection/
          if-no-files-found: error
          retention-days: 90
