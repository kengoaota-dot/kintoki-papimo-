name: Kintoki PAPIMO Work Confirmation

on:
  workflow_dispatch:
    inputs:
      business_date:
        description: 'Reviewed business date YYYY-MM-DD'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: papimo-collection
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numeric dependencies
        run: python -m pip install beautifulsoup4==4.14.3 Pillow==12.0.0 numpy==2.3.5
      - name: Test definition safeguards
        run: python -m unittest test_definition -v
      - name: Restore cumulative state without resetting history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python restore_state.py
      - name: Apply hash-bound Work reviews without fetching PAPIMO
        env:
          REVIEW_DAY: ${{ inputs.business_date }}
        run: python complete_saved.py --artifact-dir restored --date "$REVIEW_DAY" --reviews-dir reviews --out finalized
      - name: Preserve reviewed cumulative numeric state and remaining exceptions
        if: ${{ always() && hashFiles('finalized/state/papimo.sqlite3') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: papimo-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: finalized/
          if-no-files-found: error
          retention-days: 90
